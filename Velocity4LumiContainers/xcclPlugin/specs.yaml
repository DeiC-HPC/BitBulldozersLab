versions:
  - spec:
    - 0.1
    - 0.2
    - 0.3
    - 1.18.0
variables:
  - name: git_hash
    value: 17d41cb
    when: xcclPlugin@0.1
  - name: git_hash
    value: 6dae1b0
    when: xcclPlugin@0.2
  - name: git_hash
    value: 1ea938a
    when: xcclPlugin@0.3
  - name: tarball_download
    value: https://github.com/aws/aws-ofi-nccl/archive/refs/tags/v1.18.0.tar.gz
    when: xcclPlugin@1.18.0
  - name: real_version
    value: aws_ofi_rccl_working
    when: xcclPlugin@0.1
  - name: real_version
    value: aws_ofi_rccl_latest
    when: xcclPlugin@0.2
  - name: real_version
    value: aws_open_ofi_1.14.x-xccl
    when: xcclPlugin@0.3
dependencies:
  - spec: libfabric
    scope: build
  - spec: libcxi
    scope: build
  - spec: rocm
    scope: build
  - spec: mpich
    scope: build
  - spec: hwloc
    scope: build
    when: xcclPlugin@0.3:1.18.0
  - spec: fakeGpu
    scope: build
    when: system=lumig
files:
  - name: aws.patch
templates:
  - name: opensuse_aws_ofi_rccl
    when: distro=opensuse xcclPlugin@0.1:0.2
  - name: opensuse_open_ofi_xccl
    when: distro=opensuse xcclPlugin@0.3
  - name: opensuse_aws_ofi_nccl
    when: distro=opensuse xcclPlugin@1.18.0