versions:
  - spec:
      - 6.2.4
      - 1.13.0
      - 1.14.0

variables:
  - name: git_hash
    value: 47597c1
    when: omnitrace@6.2.4
  - name: download_url
    value: https://github.com/ROCm/omnitrace/releases/download/v1.13.0/omnitrace-1.13.0-opensuse-15.5-ROCm-60200-PAPI-OMPT-Python3.sh
    when: omnitrace@1.13.0
  - name: download_url
    value: https://github.com/ROCm/rocprofiler-systems/releases/download/rocm-6.3.3/rocprofiler-systems-0.1.2-opensuse-15.6-ROCm-60200-PAPI-OMPT-Python3.sh
    when: omnitrace@1.14.0

dependencies:
  - spec: python
    scope: build
  - spec: rocm
    scope: build
  - spec: packages
    scope: build
  - spec: mpich
    scope: build
    when: system=lumig omnitrace@6.2.4

templates:
  - name: opensuse_release
    when: omnitrace@1.13.0:1.14.0
  - name: opensuse
    when: omnitrace@6.2.4